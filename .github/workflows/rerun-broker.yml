name: rerun-broker

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  rerun-broker:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.type == 'Bot' &&
      github.event.comment.user.login == 'hamster-dan[bot]' &&
      startsWith(github.event.comment.body, '<!-- hamsterdan-rerun ')
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    env:
      COMMENT_BODY: ${{ github.event.comment.body }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate and request exact PR run rerun
        shell: bash
        run: |
          set -euo pipefail
          request_output="$(
            python tools/rerun_broker.py parse-marker --marker "$COMMENT_BODY"
          )"
          readarray -t request <<<"$request_output"
          [[ "${#request[@]}" -eq 3 ]]
          run_id="${request[0]}"
          expected_head="${request[1]}"
          operation="${request[2]}"
          run="$(gh api "repos/${REPOSITORY}/actions/runs/${run_id}")"
          python tools/rerun_broker.py validate-run \
            --run-id "$run_id" \
            --head "$expected_head" \
            --operation "$operation" \
            --repository "$REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            <<<"$run"
          gh api --method POST "repos/${REPOSITORY}/actions/runs/${run_id}/rerun"
